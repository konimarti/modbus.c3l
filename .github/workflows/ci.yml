name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'C3 compiler version to use'
        required: false
        default: 'v0.8.6'

env:
  C3_VERSION: v0.8.6
  PYMODBUS_VERSION: 3.16.2

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup C3
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$C3_VERSION}"
          # /opt is root-owned on hosted runners: unpack below RUNNER_TEMP
          mkdir -p "$RUNNER_TEMP/c3"
          wget -O "$RUNNER_TEMP/c3.tar.gz" "https://github.com/c3lang/c3c/releases/download/${VERSION}/c3-linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/c3.tar.gz" -C "$RUNNER_TEMP/c3" --strip-components=1
          echo "$RUNNER_TEMP/c3" >> "$GITHUB_PATH"

      - name: Unit tests
        run: c3c test

      - name: Build mbtool
        run: c3c build mbtool

      - name: Smoke test and exit codes of mbtool
        run: |
          tools/smoke.sh build/mbtool
          tools/cli-test.sh build/mbtool

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymodbus
        run: python -m pip install "pymodbus==${PYMODBUS_VERSION}"

      - name: Interoperability with pymodbus (Modbus TCP framing)
        run: tools/peer/run.sh

      - name: Interoperability with pymodbus (RTU framing over TCP)
        run: tools/peer/run.sh --rtu

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup C3
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$C3_VERSION}"
          # unpack below RUNNER_TEMP (not /opt) and put the folder that holds the c3c binary on the PATH
          mkdir -p "$RUNNER_TEMP/c3"
          curl -L -o "$RUNNER_TEMP/c3.zip" "https://github.com/c3lang/c3c/releases/download/${VERSION}/c3-macos.zip"
          unzip -q "$RUNNER_TEMP/c3.zip" -d "$RUNNER_TEMP/c3"
          C3C="$(find "$RUNNER_TEMP/c3" -name c3c -type f | head -n 1)"
          chmod +x "$C3C"
          echo "$(dirname "$C3C")" >> "$GITHUB_PATH"

      - name: Unit tests
        run: c3c test

      - name: Build mbtool
        run: c3c build mbtool

      - name: Smoke test and exit codes of mbtool
        run: |
          tools/smoke.sh build/mbtool
          tools/cli-test.sh build/mbtool

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymodbus
        run: python -m pip install "pymodbus==${PYMODBUS_VERSION}"

      - name: Interoperability with pymodbus (Modbus TCP framing)
        run: tools/peer/run.sh

      - name: Interoperability with pymodbus (RTU framing over TCP)
        run: tools/peer/run.sh --rtu

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup C3
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:C3_VERSION }
          Invoke-WebRequest -Uri "https://github.com/c3lang/c3c/releases/download/$version/c3-windows.zip" -OutFile "$env:RUNNER_TEMP\c3.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\c3.zip" -DestinationPath "$env:RUNNER_TEMP\c3"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\c3" -Recurse -Filter c3c.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $dir.DirectoryName

      - name: Unit tests
        run: c3c test

      - name: Build mbtool
        run: c3c build mbtool

      # The scripts are POSIX shell: Git Bash is on the runner. The pymodbus runs are Linux and macOS only
      # (the harness script compiles the peers with c3c from bash).
      - name: Smoke test and exit codes of mbtool
        shell: bash
        run: |
          tools/smoke.sh build/mbtool.exe
          tools/cli-test.sh build/mbtool.exe
